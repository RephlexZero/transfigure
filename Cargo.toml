[workspace]
resolver = "2"
members = [
    "crates/converter",
    "crates/app",
    "crates/og-gen",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "AGPL-3.0-only"
license-file = "LICENSE"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true

# Image and audio codecs are unusably slow unoptimised (AVIF encoding, HEIC
# decoding); optimise dependencies even in dev builds and tests.
[profile.dev.package."*"]
opt-level = 2
