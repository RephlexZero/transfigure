  <body>
    <!-- Shown until the WASM app mounts (main.rs removes it): the mark, its
         two inks drifting in and out of register. -->
    <div id="boot" aria-hidden="true" style="min-height:100vh;display:flex;align-items:center;justify-content:center">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" style="isolation:isolate">
        <circle cx="12" cy="12" r="10" stroke="#0078bf" stroke-width="1.8" style="mix-blend-mode:multiply"/>
        <path d="M12 5.5 18 16.5H6Z" fill="#e8473c" stroke="#e8473c" stroke-width="1.4" stroke-linejoin="round" style="mix-blend-mode:multiply;animation:boot 1.6s ease-in-out infinite"/>
      </svg>
      <style>
        body{margin:0;background:#efebe3}
        @media (prefers-color-scheme:dark){body{background:#16151a}#boot circle{stroke:#4aa8f0;mix-blend-mode:screen!important}#boot path{fill:#ff6b5e;stroke:#ff6b5e;mix-blend-mode:screen!important}}
        @keyframes boot{0%,100%{transform:translate(1.2px,-0.9px);opacity:.35}50%{transform:none;opacity:1}}
        @media (prefers-reduced-motion:reduce){#boot path{animation:none}}
      </style>
    </div>
    <noscript>
      <style>#boot{display:none!important}</style>
      <main style="max-width:640px;margin:3rem auto;padding:0 1.5rem;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;line-height:1.6">
        <h1>Transfigure — Free Private File Converter</h1>
        <p>
          Transfigure converts images, documents, spreadsheets, audio and config
          files entirely inside your browser using Rust compiled to WebAssembly.
          Files never leave your device — there is no upload, no account, and no
          tracking.
        </p>
        <h2>Supported conversions</h2>
        <ul>
          <li>Images: HEIC, JPG, PNG, WebP, GIF, BMP, TIFF, ICO, SVG, QOI, TGA, DDS, HDR, EXR → JPG, PNG, WebP, AVIF, PDF, GIF, BMP, TIFF, ICO, QOI, TGA</li>
          <li>Audio: MP3, M4A (AAC/ALAC), AAC, WAV, FLAC, OGG, AIFF, CAF → MP3, WAV, FLAC</li>
          <li>Documents: DOCX, ODT, RTF, PDF, Markdown, HTML, TXT → PDF, DOCX, HTML, Markdown, TXT</li>
          <li>Spreadsheets: XLSX, XLS, ODS, CSV, TSV, JSON → XLSX, CSV, JSON, TSV</li>
          <li>Structured data: JSON ↔ YAML ↔ TOML ↔ XML</li>
          <li>Encoding: any file ↔ Base64</li>
        </ul>
        <p>
          Batch conversion is supported, with results downloadable individually
          or bundled as ZIP, TAR.GZ, TAR.XZ or 7Z. This page requires JavaScript
          and WebAssembly to run the converter — enable JavaScript to use the
          app interactively.
        </p>
        <p>
          Open source under AGPL-3.0.
          <a href="https://github.com/RephlexZero/transfigure">Source on GitHub</a>.
        </p>
      </main>
    </noscript>
