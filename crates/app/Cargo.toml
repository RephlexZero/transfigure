[package]
name = "transfigure-app"
version.workspace = true
edition.workspace = true
license-file.workspace = true

[dependencies]
leptos = { version = "0.7", features = ["csr"] }
converter = { path = "../converter" }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde_json = "1"
console_error_panic_hook = "0.1"
getrandom = { version = "0.3", features = ["wasm_js"] }
# lopdf pulls in getrandom 0.4, which selects its browser backend by feature.
getrandom_04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }

[dependencies.web-sys]
version = "0.3"
features = [
    "Window",
    "DragEvent",
    "DataTransfer",
    "File",
    "FileList",
    "Blob",
    "BlobPropertyBag",
    "Url",
    "HtmlInputElement",
    "HtmlAnchorElement",
    "HtmlSelectElement",
    "HtmlElement",
    "Document",
    "Element",
    "Navigator",
    "KeyboardEvent",
    "ClipboardEvent",
    "console",
]
