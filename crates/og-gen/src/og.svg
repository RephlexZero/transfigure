<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Set in Bricolage Grotesque and JetBrains Mono (crates/app/fonts). resvg
       only sees installed fonts, so for the exact faces install those two or
       render this file in a browser; otherwise it falls back to a system sans. -->

  <!-- Paper -->
  <rect width="1200" height="630" fill="#efebe3"/>

  <!-- Masthead: the mark, its two inks slightly off register, and the name -->
  <g transform="translate(64,52)" style="isolation:isolate">
    <circle cx="23.4" cy="25.2" r="20" fill="none" stroke="#0078bf" stroke-width="3.6" style="mix-blend-mode:multiply"/>
    <path d="M24 11 36 33H12Z" fill="#e8473c" stroke="#e8473c" stroke-width="2.8" stroke-linejoin="round" style="mix-blend-mode:multiply"/>
    <path d="M18 26h12" stroke="#18171c" stroke-width="3.2"/>
  </g>
  <text x="124" y="91" font-family="Bricolage Grotesque, DejaVu Sans, sans-serif" font-weight="700" font-size="40" letter-spacing="-1" fill="#18171c">Transfigure</text>
  <text x="1136" y="88" text-anchor="end" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="20" fill="#57534d">transfigure.ing</text>
  <rect x="64" y="122" width="1072" height="3" fill="#18171c"/>

  <!-- Specimen: .heic in source ink overprinted by .jpg in result ink -->
  <g font-family="Bricolage Grotesque, DejaVu Sans, sans-serif" font-weight="800" font-size="236" letter-spacing="-12" style="isolation:isolate">
    <text x="56" y="384" fill="#0078bf" style="mix-blend-mode:multiply">.heic</text>
    <text x="436" y="384" fill="#e8473c" style="mix-blend-mode:multiply">.jpg</text>
  </g>
  <!-- Baseline guide -->
  <rect x="64" y="384" width="1072" height="2" fill="#e8473c" fill-opacity="0.85"/>
  <text x="1136" y="374" text-anchor="end" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="15" fill="#b8291f">baseline</text>

  <!-- Headline -->
  <text x="64" y="500" font-family="Bricolage Grotesque, DejaVu Sans, sans-serif" font-weight="800" font-size="64" letter-spacing="-2.4" fill="#18171c">Convert files. <tspan fill="#e8473c">Upload nothing.</tspan></text>

  <!-- Facts -->
  <rect x="64" y="540" width="1072" height="1" fill="#ccc5b8"/>
  <text x="64" y="582" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="20" fill="#57534d">images · audio · documents · data — converted in your browser, free and open source</text>
</svg>
