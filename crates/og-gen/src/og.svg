<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <!-- Drafting-table grid matching the site background -->
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#e6dfd0" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#0b0a07"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Plate frame -->
  <rect x="40" y="40" width="1120" height="550" fill="#100e0a"
        stroke="#e6dfd0" stroke-opacity="0.15" stroke-width="1.5"/>

  <!-- Registration ticks in the plate corners -->
  <path d="M 40 64 L 40 40 L 64 40" fill="none" stroke="#d9a441" stroke-width="4"/>
  <path d="M 1136 590 L 1160 590 L 1160 566" fill="none" stroke="#d9a441" stroke-width="4"/>

  <!-- Alembic mark: triangle in circle -->
  <g transform="translate(600,148)">
    <circle cx="0" cy="0" r="52" fill="none" stroke="#d9a441" stroke-width="4"/>
    <path d="M 0 -34 L 31 23 L -31 23 Z" fill="none" stroke="#d9a441" stroke-width="4" stroke-linejoin="round"/>
    <line x1="-15" y1="5" x2="15" y2="5" stroke="#d9a441" stroke-width="4"/>
  </g>

  <!-- Wordmark -->
  <text x="600" y="290" text-anchor="middle"
        font-family="DejaVu Sans Mono, monospace" font-weight="bold" font-size="64"
        letter-spacing="18" fill="#e6dfd0">TRANSFIGURE</text>

  <!-- Headline -->
  <text x="600" y="356" text-anchor="middle"
        font-family="DejaVu Sans Mono, monospace" font-weight="bold" font-size="30"
        letter-spacing="4" fill="#d9a441">CONVERT FILES. UPLOAD NOTHING.</text>

  <!-- Tagline -->
  <text x="600" y="404" text-anchor="middle"
        font-family="DejaVu Sans Mono, monospace" font-size="20"
        fill="#e6dfd0" fill-opacity="0.55">File conversion that never leaves your browser.</text>

  <!-- Format chips: square, ledger-style -->
  <g font-family="DejaVu Sans Mono, monospace" font-size="15" font-weight="bold">
    <rect x="333" y="442" width="74" height="34" fill="none" stroke="#d9a441" stroke-opacity="0.5" stroke-width="1.5"/>
    <text x="370" y="464" text-anchor="middle" fill="#d9a441">PNG</text>

    <rect x="419" y="442" width="74" height="34" fill="none" stroke="#6fae8f" stroke-opacity="0.6" stroke-width="1.5"/>
    <text x="456" y="464" text-anchor="middle" fill="#6fae8f">JPG</text>

    <rect x="505" y="442" width="82" height="34" fill="none" stroke="#d9a441" stroke-opacity="0.5" stroke-width="1.5"/>
    <text x="546" y="464" text-anchor="middle" fill="#d9a441">WEBP</text>

    <rect x="599" y="442" width="74" height="34" fill="none" stroke="#6fae8f" stroke-opacity="0.6" stroke-width="1.5"/>
    <text x="636" y="464" text-anchor="middle" fill="#6fae8f">CSV</text>

    <rect x="685" y="442" width="82" height="34" fill="none" stroke="#d9a441" stroke-opacity="0.5" stroke-width="1.5"/>
    <text x="726" y="464" text-anchor="middle" fill="#d9a441">JSON</text>

    <text x="785" y="464" fill="#e6dfd0" fill-opacity="0.35">+more</text>
  </g>

  <!-- Feature summary -->
  <text x="600" y="530" text-anchor="middle"
        font-family="DejaVu Sans Mono, monospace" font-size="16"
        fill="#e6dfd0" fill-opacity="0.4">No uploads · No account · No tracking · Works offline · Free forever</text>

  <!-- Domain -->
  <text x="600" y="567" text-anchor="middle"
        font-family="DejaVu Sans Mono, monospace" font-weight="bold" font-size="19"
        letter-spacing="2" fill="#d9a441" fill-opacity="0.85">transfigure.ing</text>
</svg>
